[package]
name = "anotadinho-ui"
version = "0.1.0"
edition = "2021"
description = "Yew frontend for Anotadinho (compiles to WASM)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
gloo = "0.11"
gloo-storage = "0.3"
gloo-net = "0.4"
gloo-events = "0.2"
gloo-file = "0.3"
gloo-dialogs = "0.2"
gloo-utils = "0.2"
gloo-timers = "0.3"
js-sys = "0.3"
console_error_panic_hook = "0.1"
pulldown-cmark = { version = "0.10", default-features = false, features = ["html"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "Window",
    "Location",
    "Navigator",
    "console",
    "CssStyleDeclaration",
    "DomTokenList",
    "Event",
    "EventTarget",
    "InputEvent",
    "KeyboardEvent",
    "MouseEvent",
    "Node",
    "NodeList",
    "Storage",
    "Selection",
    "Range",
]
