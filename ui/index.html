<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anotadinho</title>
    <link data-trunk rel="rust" data-wasm-opt="z" data-target-triple="wasm32-unknown-unknown" data-target-name="anotadinho-ui"/>
    <link data-trunk rel="css" href="src/styles/main.css"/>
    <link data-trunk rel="css" href="src/styles/components.css"/>
    <!-- Mermaid e highlight.js vêm de `ui/vendor/`, não de CDN (ciclo 243).
         Buscá-los na internet a cada abertura deixava diagrama e realce de
         sintaxe dependendo de conexão — num app de notas locais — e punha
         código de terceiros entrando na janela em tempo de execução. -->
    <link data-trunk rel="copy-file" href="vendor/mermaid.min.js"/>
    <!-- Grafo 3D (ciclo 301). Autocontido: traz o three.js dentro, então
         não há segunda dependência a versionar. Vendorizado como o
         mermaid — o app roda offline, e buscar de CDN o quebraria. -->
    <link data-trunk rel="copy-file" href="vendor/3d-force-graph.min.js"/>
    <link data-trunk rel="copy-file" href="vendor/highlight.min.js"/>
    <link data-trunk rel="copy-file" href="vendor/atom-one-dark.min.css"/>
    <script src="/mermaid.min.js"></script>
    <script src="/3d-force-graph.min.js"></script>
    <link rel="stylesheet" href="/atom-one-dark.min.css">
    <script src="/highlight.min.js"></script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
