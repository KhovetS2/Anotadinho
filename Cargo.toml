[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/vault",
    "crates/search",
    "crates/ipc",
]
exclude = ["ui", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
authors = ["KhovetS2"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.4"
notify = "6.1"
pulldown-cmark = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
