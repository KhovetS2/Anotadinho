[package]
name = "anotadinho-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "CLI headless pro vault do Anotadinho — lista/lê/busca/exporta sem precisar da janela Tauri (Anotadinho cli)"

[[bin]]
name = "anotadinho-cli"
path = "src/main.rs"

[dependencies]
anotadinho-ipc = { path = "../ipc" }
clap = { version = "4.5", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
predicates = "3.1"
