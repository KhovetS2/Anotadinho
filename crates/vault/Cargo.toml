[package]
name = "anotadinho-vault"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "I/O de arquivos do vault, watcher, locks (Anotadinho vault)"

[dependencies]
anotadinho-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
walkdir = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
notify = { workspace = true }

# Só pelo `setpgid`/`killpg` de `processo`: cancelar o agente precisa
# alcançar os netos, e o wrapper Node dos agentes sempre tem um.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.9"
