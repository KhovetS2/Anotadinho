[package]
name = "anotadinho-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anotadinho-core = { path = "../core" }
anotadinho-ipc = { path = "../ipc" }
# O watcher do vault (ciclo 398), o mesmo que a janela e o `cli watch` usam.
anotadinho-vault = { path = "../vault" }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }

# Só pelo `localtime_r` (ciclo 315): o calendário ancora no dia de HOJE,
# e "hoje" é o do fuso da pessoa — em UTC, depois das 21h em Brasília a
# TUI já estaria no dia seguinte. O núcleo não lê relógio de propósito.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
