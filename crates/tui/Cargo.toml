[package]
name = "anotadinho-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anotadinho-core = { path = "../core" }
anotadinho-ipc = { path = "../ipc" }
# O watcher do vault (ciclo 398), o mesmo que a janela e o `cli watch` usam.
anotadinho-vault = { path = "../vault" }
clap = { version = "4.5", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
# O relógio no fuso da pessoa (ciclo 448), nos três sistemas. Já vinha
# pela árvore do `vault`; aqui só fica declarado quem usa.
chrono = { workspace = true, features = ["clock"] }
# A largura de cada caractere na tela, pra cortar a linha de código sem
# passar da borda (ciclo 494). Já vinha pela árvore do ratatui.
unicode-width = "0.2"
